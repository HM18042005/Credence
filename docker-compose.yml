version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: credence_user
      POSTGRES_PASSWORD: credence_pass
      POSTGRES_DB: credence_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credence_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://credence_user:credence_pass@postgres:5432/credence_db
      # WARNING: Change these values in production!
      SECRET_KEY: your-secret-key-change-in-production
      DEBUG: "True"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
